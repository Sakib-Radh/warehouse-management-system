services:
  app:
    image: webdevops/php-nginx:8.4
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - PHP_DISPLAY_ERRORS=1
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:80"
    networks:
      - sail
    depends_on:
      - pgsql
      - redis

  pgsql:
    image: postgres:15
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - sail-pgsql:/var/lib/postgresql/data
    networks:
      - sail

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - sail-redis:/data
    networks:
      - sail

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    networks:
      - sail
    depends_on:
      - pgsql

networks:
  sail:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
